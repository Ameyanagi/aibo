# Build the binaries and attach them to a GitHub Release.
#
# **Partly §19.** macOS reaches what §19 asks for — a Developer ID signed,
# notarised, stapled DMG with `LSUIElement` — but only when the Apple secrets are
# configured; without them the same DMG is built unsigned so that testing is
# never blocked on Apple paperwork. Windows is still unsigned: §19 wants an
# Authenticode-signed installer, and the certificate does not exist yet. The
# generated release notes state which of these is true of the build in hand,
# rather than leaving a tester to guess whether a Gatekeeper or SmartScreen
# prompt means the download is broken.
#
# Secrets, all optional (`gh secret set NAME < file`):
#
#   MACOS_CERT_P12       base64 of the Developer ID Application .p12
#   MACOS_CERT_PASSWORD  its export password
#   ASC_KEY_P8           base64 of an App Store Connect API key (.p8)
#   ASC_KEY_ID           that key's id
#   ASC_ISSUER_ID        the issuer uuid from App Store Connect
#
# Signing needs the first two; notarisation needs all five.
#
# What it is for: getting a build onto a Windows machine to test. Two ways in:
#
#   * Push a tag — `git tag v0.1.0-beta.1 && git push origin v0.1.0-beta.1`.
#     Produces a release named after the tag. Any tag containing `-` is marked
#     prerelease, so `v0.1.0-beta.1` cannot be mistaken for `v0.1.0`.
#   * Run it from the Actions tab. Produces a rolling `dev` prerelease that is
#     replaced each time, so the download URL stays put:
#     https://github.com/<owner>/<repo>/releases/tag/dev
#
# CI already builds both targets on every push. This exists because an artifact
# from a workflow run needs a GitHub login and expires in 14 days, which makes it
# useless for handing a build to a tester.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Read-only by default; only `publish` gets `contents: write`.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      # Both platforms are reported even if one fails to link, so a Windows-only
      # break does not hide whether macOS still builds.
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            binary: target/release/aibo.exe
            # Kept as a portable fallback beside the per-user installer built
            # below. A zip would add an extraction step and buys nothing —
            # Windows applies Mark-of-the-Web to either.
            asset: aibo-windows-x86_64.exe
          - name: macOS
            os: macos-14
            binary: target/release/aibo
            # A disk image holding `aibo.app`, not a tarball of a bare binary.
            # `LSUIElement` lives in the bundle's Info.plist, and a notarisation
            # ticket can only be stapled to a bundle or an image — see
            # `packaging/macos/Info.plist`.
            asset: aibo-macos-aarch64.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: release-${{ matrix.os }}

      - name: Work out the version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # From the tag, so the version a user reports cannot drift from the
          # build they downloaded. A manual run has no tag, so it is stamped
          # with the short sha instead of a version it is not.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev.${GITHUB_SHA::7}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build the release binary
        env:
          AIBO_BUILD_VERSION: ${{ steps.version.outputs.version }}
        run: cargo build --release --bin aibo --locked

      # `--locked` above is the load-bearing flag: a release built from a
      # resolver that quietly picked different versions is not the thing CI
      # tested.

      # Whether the Apple credentials are configured. Mapped to an output
      # because `secrets` cannot be read from a step's `if:` directly, and
      # because every signing step below needs the same answer.
      #
      # Absent secrets are not an error: an unsigned build is still a build
      # someone can test, and the whole point of gating is that Windows testing
      # is not blocked on Apple paperwork.
      - name: Check for signing credentials
        id: creds
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERT: ${{ secrets.MACOS_CERT_P12 }}
          ASC: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          if [ -n "$CERT" ]; then sign=true; else sign=false; fi
          # Notarisation needs signing first, so it can never be the only one.
          if [ "$sign" = true ] && [ -n "$ASC" ]; then notarise=true; else notarise=false; fi
          echo "sign=$sign" >> "$GITHUB_OUTPUT"
          echo "notarise=$notarise" >> "$GITHUB_OUTPUT"
          echo "signing=$sign, notarising=$notarise" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="dist/aibo.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp target/release/aibo "$app/Contents/MacOS/aibo"
          chmod +x "$app/Contents/MacOS/aibo"
          cp packaging/macos/aibo.icns "$app/Contents/Resources/aibo.icns"
          sed "s/VERSION/${{ steps.version.outputs.version }}/g" \
            packaging/macos/Info.plist > "$app/Contents/Info.plist"
          # Verify the substitution landed rather than shipping a bundle whose
          # version reads literally "VERSION".
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
            "$app/Contents/Info.plist"

      - name: Import the signing identity
        if: steps.creds.outputs.sign == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          # A throwaway keychain with a random password, unlocked only for this
          # job. The login keychain is never touched, and nothing survives the
          # runner.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 24)"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign blocks on a GUI prompt that no one can answer
          # and the job hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

          # Read the identity out of the certificate rather than taking it as a
          # secret: one fewer value to keep in sync, and it cannot disagree with
          # the key that is actually present.
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ {print $2; exit}')"
          if [ -z "$identity" ]; then
            echo "::error::the .p12 holds no Developer ID Application identity"
            security find-identity -v -p codesigning "$keychain"
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "Signing as: $identity"

      - name: Sign the bundle
        if: steps.creds.outputs.sign == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # `--options runtime` is the hardened runtime, which notarisation
          # requires and which is why the entitlements file exists.
          codesign --force --timestamp --options runtime \
            --entitlements packaging/macos/aibo.entitlements \
            --keychain "$SIGN_KEYCHAIN" \
            --sign "$SIGN_IDENTITY" \
            dist/aibo.app
          codesign --verify --strict --verbose=2 dist/aibo.app

      - name: Build the disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # UDZO read-only compressed, which is what `hdiutil` gives a plain
          # folder. Applications symlink so the image is drag-to-install.
          # dmgbuild rather than a bare `hdiutil create -srcfolder`: it writes
          # the .DS_Store (window size, icon positions, background art)
          # programmatically, with the alias records Finder needs — the one
          # thing a committed .DS_Store cannot carry across volumes — and it
          # needs no Finder scripting, which is the flakiest thing a headless
          # runner can be asked to do. The look lives in
          # packaging/macos/dmg/settings.py.
          pipx run dmgbuild -s packaging/macos/dmg/settings.py \
            -D app=dist/aibo.app aibo "dist/${{ matrix.asset }}"
          rm -rf dist/aibo.app

      - name: Sign the disk image
        if: steps.creds.outputs.sign == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # The image is signed separately from the bundle inside it: Gatekeeper
          # checks the image the user actually downloaded.
          codesign --force --timestamp --keychain "$SIGN_KEYCHAIN" \
            --sign "$SIGN_IDENTITY" "dist/${{ matrix.asset }}"

      - name: Notarise and staple
        if: steps.creds.outputs.notarise == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        shell: bash
        run: |
          set -euo pipefail
          # An App Store Connect API key rather than an Apple ID and
          # app-specific password: scoped to notarisation, revocable on its own,
          # and not coupled to anyone's 2FA.
          key="$RUNNER_TEMP/asc.p8"
          echo "$ASC_KEY_P8" | base64 --decode > "$key"

          # `--wait` blocks until Apple answers. On rejection the log says why,
          # and printing it is the difference between a fixable failure and a
          # mystery.
          if ! xcrun notarytool submit "dist/${{ matrix.asset }}" \
              --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" \
              --wait --timeout 30m; then
            echo "::error::notarisation was rejected"
            xcrun notarytool history --key "$key" --key-id "$ASC_KEY_ID" \
              --issuer "$ASC_ISSUER_ID" | head -20
            rm -f "$key"
            exit 1
          fi

          # Stapling is the point of using a disk image: it embeds the ticket so
          # Gatekeeper does not need to reach Apple on first launch.
          xcrun stapler staple "dist/${{ matrix.asset }}"
          rm -f "$key"

          # Proves the finished artefact passes the check a user's machine will
          # run, rather than trusting that each step above worked.
          spctl --assess --type open --context context:primary-signature -vv \
            "dist/${{ matrix.asset }}"

      - name: Package the Windows binary
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "${{ matrix.binary }}" "dist/${{ matrix.asset }}"

      - name: Build the per-user Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found at $iscc"
          }

          $source = (Resolve-Path '${{ matrix.binary }}').Path
          $output = (Resolve-Path 'dist').Path
          $icon = (Resolve-Path 'packaging/windows/aibo.ico').Path
          & $iscc "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            "/DMySourceExe=$source" "/DMyOutputDir=$output" `
            "/DMySetupIcon=$icon" 'packaging/windows/aibo.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path 'dist/aibo-windows-x86_64-setup.exe')) {
            throw 'Inno Setup did not produce the expected installer'
          }

      # Nothing is signed, so a checksum is the only integrity claim a tester
      # can actually check. Cheap to produce and worth having.
      - name: Checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          for asset in *; do
            case "$asset" in *.sha256) continue ;; esac
            if command -v sha256sum >/dev/null; then
              sha256sum "$asset" > "$asset.sha256"
            else
              shasum -a 256 "$asset" > "$asset.sha256"
            fi
            cat "$asset.sha256"
          done

      # §15's budget is 60 MB installed, stretch 40 — see the same step in
      # `ci.yml` for why the 25 MB this used to check was the wrong number.
      - name: Report the binary size against the §15 budget
        shell: bash
        run: |
          size=$(wc -c < "${{ matrix.binary }}")
          mb=$(( size / 1048576 ))
          echo "### ${{ matrix.name }}: ${mb} MB (§15: 60 MB, stretch 40)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$mb" -gt 60 ]; then
            echo ":x: over the §15 budget by $(( mb - 60 )) MB" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$mb" -gt 40 ]; then
            echo ":warning: over the 40 MB stretch by $(( mb - 40 )) MB" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.asset }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-24.04
    # The only job that can write to the repository, and the only reason this
    # workflow needs more than read.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Collect the built assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          merge-multiple: true
          path: dist

      - name: Work out what is being released
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            tag="${{ github.ref_name }}"
            # A tag with a hyphen is a prerelease by semver convention, so
            # `v0.1.0-beta.1` cannot be mistaken for `v0.1.0` in the releases
            # list.
            case "$tag" in
              *-*) prerelease=true ;;
              *)   prerelease=false ;;
            esac
          else
            # Manual runs go to one rolling release so the download URL is
            # stable for whoever is testing.
            tag=dev
            prerelease=true
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        env:
          # Read here rather than passed up from the build job: a matrix job's
          # outputs are last-writer-wins, and the question is about
          # configuration, which this job can see for itself. Notes that claim
          # "unsigned" over a notarised image would send a tester through
          # Gatekeeper steps they do not need.
          SIGNED: ${{ secrets.MACOS_CERT_P12 != '' }}
          NOTARISED: ${{ secrets.MACOS_CERT_P12 != '' && secrets.ASC_KEY_P8 != '' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Built from \`${{ github.sha }}\`."
            echo
            echo "## macOS"
            echo
            if [ "$NOTARISED" = "true" ]; then
              echo "\`aibo-macos-aarch64.dmg\` is Developer ID signed, notarised and"
              echo "stapled. Open the image and drag aibo to Applications."
            elif [ "$SIGNED" = "true" ]; then
              echo "\`aibo-macos-aarch64.dmg\` is Developer ID signed but **not notarised**,"
              echo "so Gatekeeper will still object on a machine that did not build it."
              echo "Open it once from System Settings → Privacy & Security → Open Anyway."
            else
              echo "\`aibo-macos-aarch64.dmg\` is **not signed or notarised** (§19 puts that"
              echo "in P8). Gatekeeper will block it — that is expected, not a broken"
              echo "download. Open it once from System Settings → Privacy & Security →"
              echo "Open Anyway, or clear the quarantine flag:"
              echo
              echo "    xattr -dr com.apple.quarantine /Applications/aibo.app"
            fi
            echo
            echo "## Windows"
            echo
            echo "\`aibo-windows-x86_64-setup.exe\` installs for the current user under"
            echo "\`%LOCALAPPDATA%\\Programs\\aibo\`; it does not require administrator rights."
            echo "The portable \`aibo-windows-x86_64.exe\` remains available."
            echo
            echo "Both Windows downloads are **not Authenticode signed** — §19 wants an"
            echo "OV certificate and notes that reputation has to accumulate before"
            echo "SmartScreen stops warning. Expect a SmartScreen prompt:"
            echo "More info → Run anyway."
            echo
            echo "Verify either download against the \`.sha256\` beside it."
            echo
            echo "## First run"
            echo
            echo "aibo needs Accessibility permission to read the focused field and"
            echo "insert text (§8), and no provider is configured until you add one."
            echo "Open the tray icon → Settings to sign in with ChatGPT or paste an"
            echo "API key. The hotkey is \`Alt+Space\` (\`⌥Space\` on macOS)."
          } > notes.md
          cat notes.md

      # `gh` rather than a third-party release action: it is preinstalled, and it
      # is one fewer thing with write access to the repository.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
          PRERELEASE: ${{ steps.target.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist

          flags=(--title "$TAG" --notes-file notes.md)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          # No `--target` anywhere. It trips a GITHUB_TOKEN limitation
          # (cli/cli#9514: HTTP 403 "Resource not accessible by integration"
          # despite `contents: write`; the same call works with user
          # credentials), and it is not needed: a pushed tag already pins its
          # commit, and `dev` is recut below by pushing its tag with the
          # checkout's own credentials before the release is created.

          if [ "$TAG" = "dev" ]; then
            # Deleted and recreated rather than edited, because `gh release
            # edit` cannot move a tag: editing in place would leave `dev`
            # pointing at whatever commit it was first cut from while serving
            # assets built from a newer one. The URL is unchanged either way —
            # it is keyed on the tag name, not the release id.
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release delete "$TAG" --yes --cleanup-tag
            fi
            # Move the tag with git rather than with `--target`: the checkout
            # action's credentials can push a tag, and the release then simply
            # attaches to a tag that already points at this run's commit.
            git tag -f "$TAG" "${{ github.sha }}"
            git push -f origin "refs/tags/$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            # A real version tag already exists: add to it, never replace it.
            # Deleting a published release breaks anyone who has the link.
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* "${flags[@]}"
          fi

          echo "### Released [$TAG]($(gh release view "$TAG" --json url --jq .url))" \
            >> "$GITHUB_STEP_SUMMARY"
