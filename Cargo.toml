[workspace]
# §6's workspace layout is `crates/*` plus `src/main.rs` (this package). That is
# the whole product.
#
# `spikes/*` is deliberately NOT a member. Every §20 spike declares its own
# `[workspace]` table and is a standalone root, so listing them here is not just
# undesirable, it does not build:
#
#     error: multiple workspace roots found in the same workspace
#
# The separation is the point. A throwaway harness must never end up linked into
# the product, must be free to pin a different dependency version while it
# probes one, and must stay buildable after the answer it was written to find
# has been folded into `crates/`. Build one with
# `cargo check --manifest-path spikes/<name>/Cargo.toml`.
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["aibo"]
license = "LicenseRef-Proprietary"
publish = false

# Every third-party version named in docs/plan.md is pinned here, once.
# Member crates opt in with `dep = { workspace = true }`.
# Versions annotated with a section reference come from the plan; unannotated
# ones are ordinary infrastructure the plan does not pin.
[workspace.dependencies]
# --- internal ---------------------------------------------------------------
aibo-core = { path = "crates/aibo-core" }
aibo-provider = { path = "crates/aibo-provider" }
aibo-session = { path = "crates/aibo-session" }
aibo-platform = { path = "crates/aibo-platform" }
aibo-store = { path = "crates/aibo-store" }
aibo-agent = { path = "crates/aibo-agent" }
aibo-tools = { path = "crates/aibo-tools" }
aibo-agent-tools-adapter = { path = "crates/aibo-agent-tools-adapter" }
aibo-ui = { path = "crates/aibo-ui" }

# --- async runtime and streams ---------------------------------------------
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "fs", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
async-trait = "0.1"
futures = "0.3"
futures-core = "0.3"
futures-util = "0.3"
process-wrap = { version = "9.1.0", features = ["tokio1"] }

# --- errors, logging, serialisation ----------------------------------------
thiserror = "2"                      # libraries (all crates/*)
anyhow = "1"                         # binary only (src/main.rs)
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# §P9+ voice input: microphone capture for push-to-talk dictation.
cpal = "0.15"
# The realtime transcription websocket. rustls with the OS trust store, for the
# same enterprise-proxy reason as reqwest above.
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
toml = "0.9"
uuid = { version = "1", features = ["v7", "serde"] }
url = "2"
unicode-segmentation = "1"           # §5 grapheme-safe middle-out truncation
nucleo-matcher = "0.3"               # fzf-style history search; Unicode-aware, returns match indices
# §P9+ @ file mentions: the owner's Japanese-aware fuzzy finder, as a library.
# yuru-ja's default reading mode embeds Lindera for kanji readings — that is
# what makes `toukei` find `統計資料.pdf`, and it is the point of using yuru
# over plain nucleo.
yuru-core = "0.1"
yuru-ja = "0.1"

# --- secrets ----------------------------------------------------------------
secrecy = "0.10.3"                   # §12 [plan note: no release in 21 months]
zeroize = "1"                        # §12
keyring = "4.1"                      # §8 [plan note: 4.x is a facade over keyring-core]

# --- network / providers ----------------------------------------------------
# `rustls-tls-native-roots` is not optional in an enterprise network, and its
# absence is what made every request fail behind a TLS-inspecting proxy.
# `rustls-tls` alone trusts **webpki-roots** — a Mozilla CA bundle compiled into
# the binary — and never consults the OS trust store. Zscaler, Netskope and every
# other inspecting proxy terminate TLS and re-sign with a private root that IT
# installed *into that store*, so the browser trusts it and aibo cannot even see
# it. The handshake fails, `is_connect()` is true, and §13 reports "offline" on a
# machine that is plainly online.
#
# Both are enabled: native roots so a corporate root is honoured, and the
# built-ins retained (see `tls_built_in_root_certs` in `http.rs`) so a machine
# with an unreadable or empty store still works.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "rustls-tls-native-roots", "gzip"] }
eventsource-stream = "0.2"
http = "1"
base64 = "0.22"
# §2 image attachments: decode + downscale before an image goes on the wire.
# `default-features = false` is load-bearing. The default set pulls `ravif`,
# which drags in a whole AVIF encoder aibo never uses; these three formats are
# exactly `SUPPORTED_IMAGE_MEDIA_TYPES` and every one of their codecs is pure
# Rust (`png`+`miniz_oxide`, `zune-jpeg`, `image-webp`), so nothing here
# compiles C. The crate is already in the tree via `iced`'s `image` feature, so
# this adds no new build.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# --- storage ----------------------------------------------------------------
rusqlite = { version = "0.40", features = ["bundled-sqlcipher-vendored-openssl", "uuid", "backup"] }  # §12, §20
# NOTE §12/S8: the vendored-OpenSSL build on Windows is the risky half and is
# marked [unverified] in the plan. Confirm in P0 before relying on it.

# --- tools ------------------------------------------------------------------
fend-core = "1.5.8"                  # §1 Compute
wasmtime = "47"                      # §11 tier 1, downloaded-on-demand CPython
wasmtime-wasi = "47"
rmcp = { version = "2.2", default-features = false } # §11 tier 2 client only

# --- ui / shell -------------------------------------------------------------
iced = { version = "0.14", default-features = false, features = ["wgpu", "advanced", "crisp", "tokio", "image-without-codecs", "svg", "markdown"] }
accesskit = "0.24.1"
# Iced 0.14 has no accessibility tree. The official platform adapters attach
# directly to the raw AppKit/Win32 view owned by iced/winit.
accesskit_macos = "0.26.3"
accesskit_windows = "0.34.0"
global-hotkey = "0.8"                # §8
tray-icon = "0.24"                   # §8
muda = "0.19"                        # §8
raw-window-handle = "0.6"            # native panel configuration in aibo-platform
arboard = "3"
enigo = "0.6"                        # §8 [plan note: self-described early alpha]

# --- updates ----------------------------------------------------------------
ed25519-dalek = "2.2"                # §19 [plan note: prefer the 2.2 line over 3.0]
sha2 = "0.10"

# --- macOS ------------------------------------------------------------------
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
# CALayer, for pinning the panel's content gravity during animated resizes.
objc2-quartz-core = "0.3"
accessibility-sys = "0.2"            # §20 [plan note: single maintainer; expect to vendor]
core-foundation = "0.10"
core-graphics = "0.24"

# --- Windows ----------------------------------------------------------------
windows = "0.62"
windows-core = "0.62"
# `event` in features: a no-op focus subscription is what wakes Chromium's
# dormant UIA trees (see windows/uia.rs), and the module is configured out
# by default.
uiautomation = { version = "0.25", features = ["event"] } # §8 [!Send + !Sync — dedicated MTA thread]

# --- dev --------------------------------------------------------------------
insta = "1"
proptest = "1"
ratex-layout = "0.1"
ratex-parser = "0.1"
ratex-svg = { version = "0.1", features = ["embed-fonts"] }
ratex-types = "0.1"
similar = "2"
tempfile = "3"

# §15: the release profile. `panic = "abort"` is deliberately ABSENT — §6 requires
# unwinding so a panic can be caught at every task boundary and the tray survives.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "unwind"
incremental = false

[package]
name = "aibo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The binary is thin: wire everything together, install the panic/crash handler (§6).
#
# Every entry is either a workspace member or something only the process entry
# point can use. `anyhow` appears here and nowhere else — §6/§13 keep it out of
# the libraries, which use `thiserror`.
[dependencies]
anyhow = { workspace = true }

# The two schedulers of §6. `tokio-util` is here for `CancellationToken`, which
# §7 puts on every `Provider::chat` and §13 makes the `esc` path.
tokio = { workspace = true }
tokio-util = { workspace = true }
# `FutureExt::catch_unwind` — §6's "catch at every task boundary".
futures = { workspace = true }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# The workspace members the binary wires together.
aibo-core = { workspace = true }
aibo-platform = { workspace = true }
aibo-provider = { workspace = true }
# The orchestration layer: §4 chain fallback, §5 assembly, §13 offline
# hysteresis and cancellation, §14 reserve-then-reconcile, §12 persistence.
aibo-session = { workspace = true }
# Opening the §12 database and reading credential files are
# both process-entry concerns: they decide what the engine is *built with*.
aibo-store = { workspace = true }
aibo-ui = { workspace = true }
aibo-agent = { workspace = true }
aibo-agent-tools-adapter = { workspace = true }

# `SessionId` is a uuid, and the binary mints one per agent task.
uuid = { workspace = true }
# `SecretString`, to hand a storage-resolved API key to `aibo-session` without
# it ever landing in a `String` that could be logged.
secrecy = { workspace = true }
# The ChatGPT-plan dictation upload (`/backend-api/transcribe`); the realtime
# path speaks websockets via tokio-tungstenite instead.
reqwest = { workspace = true }

# `PlatformBackend` exposes a clipboard *read* only, so `UiRequest::Copy` has no
# home in aibo-platform yet. arboard is the same crate aibo-platform already
# uses, so this is one implementation, not two.
arboard = { workspace = true }

# Retained for the legacy `aibo-store::Keychain` compatibility backend.
# Production uses credential files instead.
keyring = { workspace = true }
# `aibo_provider::StoredTokens` is `serde`-shaped; credential storage holds one
# JSON document per token pair.
serde_json = { workspace = true }
sha2 = { workspace = true }

# §P9+ dictation: microphone → OpenAI realtime transcription (`src/stt.rs`).
cpal = { workspace = true }
tokio-tungstenite = { workspace = true }
base64 = { workspace = true }
# `aibo_provider::TokenStore` is an `#[async_trait]`, and the binary implements
# it over credential files.
async-trait = { workspace = true }
# `aibo_store::SecretStore::get` returns `Zeroizing<String>`; implementing the
# trait means naming the type. Same crate `aibo-store` already uses.
zeroize = { workspace = true }
unicode-segmentation = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Safe wrapper around ReplaceFileW. Keeping the FFI inside this dependency lets
# the binary retain its workspace-wide `unsafe_code = "forbid"` boundary.
winsafe = { version = "0.0.19", features = ["kernel"] }

[build-dependencies]
# The Windows exe icon (`build.rs`); inert on every other target and host.
winresource = "0.1"

[dev-dependencies]
# The panic-boundary test in `diagnostics` needs `#[tokio::test]`.
tokio = { workspace = true, features = ["macros", "rt"] }
# The file-finder walk tests build throwaway directory trees.
tempfile = { workspace = true }

# cosmic-text 0.15.0 (the newest iced 0.14 accepts) panics in debug builds
# when a glyph lands at a saturated x-position — `SubpixelBin::new` does
# `trunc + 1` on an `i32` that is already `i32::MAX`, which aborted the whole
# app the first time Japanese dictation text hit the input (2026-08-01 crash
# report). The vendored copy is identical except that arithmetic saturates;
# drop the patch when an upstream release contains the fix.
[patch.crates-io]
cosmic-text = { path = "vendor/cosmic-text" }
# Same defect one layer down: cryoglyph (iced's glyphon fork) adds the atlas
# offsets to that saturated position before its own bounds check would have
# clipped the glyph out. Saturating the adds lets the degenerate glyph fall
# into the clip path instead of aborting the app.
cryoglyph = { path = "vendor/cryoglyph" }
# The IME preedit overlay inherits the window's background color forced to
# a=1.0 — on aibo's transparent panel that is an opaque black strip, which
# makes composing text unreadable (worst in light mode). The vendored copy
# derives an opposing backdrop from the text color when the window clear is
# fully transparent. See `vendor/iced_winit/src/window.rs`, [AIBO PATCH].
iced_winit = { path = "vendor/iced_winit" }
