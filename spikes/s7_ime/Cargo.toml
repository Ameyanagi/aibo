# S7 - IME composition detection (§20).
#
# Its own workspace root: a spike must never end up linked into the product build.
[package]
name = "s7_ime"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "LicenseRef-Proprietary"

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2"
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "NSRunningApplication",
    "NSWorkspace",
    "libc",
] }

# SPIKE: S7 — the Windows half is `ImmGetContext` + `ImmGetCompositionString` on
# the foreground window (§9), which §9 describes as the one platform where the
# answer is known to be clean. Not wired up here; see README.md.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_UI_Input_Ime",
    "Win32_UI_WindowsAndMessaging",
] }
