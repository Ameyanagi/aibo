# S6 - Codex endpoint via device-code auth (§20).
#
# A throwaway binary, deliberately OUTSIDE the aibo workspace (`[workspace]`
# below makes it its own root) so a spike can never end up linked into the
# product build. It depends on nothing from `crates/`.
[package]
name = "s6_codex_auth"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "LicenseRef-Proprietary"

[workspace]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "io-util", "signal"] }
url = "2"

# `cookies` is deliberately on: §3a lists "Cloudflare cookie jar for
# chatgpt.com" as one of the unknowns, and the spike cannot observe whether a
# jar is needed unless it is capable of keeping one.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "gzip",
    "cookies",
] }
