# ===========================================================================
# OpenAI — §4 `Fast` (small), `Smart`, `Vision`
# ===========================================================================

[[model]]
provider = "openai"
model = "gpt-5"
input = 1_250_000      # $1.25 /Mtok
cached_input = 125_000 # $0.125 /Mtok — 90 % off, and §5's stable prompt prefix
output = 10_000_000    # $10.00 /Mtok
# Reasoning tokens are billed as output on this family; `reasoning` omitted so
# it falls back to `output` rather than silently costing nothing.

[[model]]
provider = "openai"
model = "gpt-5-mini"
input = 250_000        # $0.25 /Mtok
cached_input = 25_000
output = 2_000_000     # $2.00 /Mtok

[[model]]
provider = "openai"
model = "gpt-5-nano"
input = 50_000
cached_input = 5_000
output = 400_000

# Batch is a real §14 provider tier, not a hypothetical: 50 % off, and the
# reason `ProviderTier` exists at all.
[[model]]
provider = "openai"
model = "gpt-5"
tier = "batch"
input = 625_000
cached_input = 125_000
output = 5_000_000

[[model]]
provider = "openai"
model = "gpt-5-mini"
tier = "batch"
input = 125_000
cached_input = 25_000
output = 1_000_000

[[model]]
provider = "openai"
model = "gpt-5"
tier = "priority"
input = 2_500_000
cached_input = 250_000
output = 20_000_000

# ===========================================================================
# Anthropic — §4 `Smart` / `Vision`
# ===========================================================================
#
# Anthropic bills cache *writes* above the input rate and cache *reads* far
# below it. `Usage` has one cached-input counter, so `cached_input` here is the
# read rate — the cheaper, far more common one for §5's stable prefix. Cache
# writes are therefore under-counted; documented rather than hidden.

[[model]]
provider = "anthropic"
model = "claude-sonnet-4-5"
input = 3_000_000      # $3.00 /Mtok
cached_input = 300_000 # $0.30 /Mtok cache read
output = 15_000_000    # $15.00 /Mtok

[[model]]
provider = "anthropic"
model = "claude-haiku-4-5"
input = 1_000_000
cached_input = 100_000
output = 5_000_000

[[model]]
provider = "anthropic"
model = "claude-opus-4-5"
input = 5_000_000
cached_input = 500_000
output = 25_000_000

[[model]]
provider = "anthropic"
model = "claude-sonnet-4-5"
tier = "batch"
input = 1_500_000
cached_input = 300_000
output = 7_500_000

# ===========================================================================
# Google Vertex AI — §4 `Smart` / `Vision` last, §10 secure tier
# ===========================================================================
#
# Gemini prices step up past a long-context threshold (commonly 200k tokens).
# `ModelPrices` has no threshold concept, so the **long-context** rate is used:
# over-estimating spend is the safe direction under a hard stop.

[[model]]
provider = "vertex"
model = "gemini-3-pro"
input = 2_500_000      # long-context rate; short requests are billed less
cached_input = 250_000
output = 15_000_000
image = 2_500_000

[[model]]
provider = "vertex"
model = "gemini-3-flash"
input = 300_000
cached_input = 30_000
output = 2_500_000

# ===========================================================================
# Azure OpenAI — §10 secure tier
# ===========================================================================
#
# Rows are keyed by *model*, but Azure addresses models by **deployment name**,
# which the user chooses. A deployment called "prod-gpt" will not match here
# and will read as unpriced until the user adds a row. That is the honest
# outcome; guessing a mapping would mis-bill silently.

[[model]]
provider = "azure-openai"
model = "gpt-5"
input = 1_250_000
cached_input = 125_000
output = 10_000_000

[[model]]
provider = "azure-openai"
model = "gpt-5-mini"
input = 250_000
cached_input = 25_000
output = 2_000_000

# ===========================================================================
# AWS Bedrock — §10 secure tier
# ===========================================================================
#
# Bedrock model ids are region-scoped and often carry an inference-profile
# prefix ("us.anthropic.…"). Both spellings are listed for the models aibo
# binds by default; anything else needs a user row.

[[model]]
provider = "bedrock"
model = "anthropic.claude-sonnet-4-5-v1:0"
input = 3_000_000
cached_input = 300_000
output = 15_000_000

[[model]]
provider = "bedrock"
model = "us.anthropic.claude-sonnet-4-5-v1:0"
input = 3_000_000
cached_input = 300_000
output = 15_000_000

