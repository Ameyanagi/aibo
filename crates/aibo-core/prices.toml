# ===========================================================================
# Ollama / llama.cpp — §4 `Cheap` primary, §13 offline
# ===========================================================================
#
# Genuinely zero *marginal* cost: the model runs on the user's own hardware and
# there is no bill to meter. This is the one place a 0 rate is a fact rather
# than a missing row — which is exactly why the row exists instead of being
# omitted. An omitted row would make every local request "cost unknown" and
# inflate `SpendMeter::unpriced_requests` for the offline path.

[[model]]
provider = "ollama"
model = "qwen3:8b"
input = 0
output = 0

[[model]]
provider = "ollama"
model = "qwen3:14b"
input = 0
output = 0

[[model]]
provider = "ollama"
model = "llama3.3:70b"
input = 0
output = 0

[[model]]
provider = "ollama"
model = "gpt-oss:20b"
input = 0
output = 0

# ===========================================================================
# Codex — §3a, §4 `Smart` primary
# ===========================================================================
#
# Zero for the same structural reason as Ollama and for a different practical
# one: the ChatGPT subscription is a flat fee, so there is **no per-token
# charge to meter**. The user's real constraint on this path is the plan's
# rate/usage quota, which OpenAI enforces server-side and which §3a reads out
# of the `chatgpt_plan_type` claim — it is not a spend, and the spend meter
# must not invent one.
#
# Only the five ids §3a *measured as working* appear. The API-style ids
# (`gpt-5`, `gpt-5-codex`, `gpt-5.1-codex`, `gpt-5.1-codex-mini`,
# `codex-mini-latest`) are absent deliberately: they hard-400 with "not
# supported when using Codex with a ChatGPT account", so a price for them would
# be a price for a request that cannot be made.

[[model]]
provider = "codex"
model = "gpt-5.5"          # 435 ms TTFT p50 (§3a) — the floor
input = 0
output = 0

[[model]]
provider = "codex"
model = "gpt-5.6-terra"    # 446 ms
input = 0
output = 0

[[model]]
provider = "codex"
model = "gpt-5.3-codex-spark"  # 499 ms
input = 0
output = 0

[[model]]
provider = "codex"
model = "gpt-5.6-luna"     # 515 ms
input = 0
output = 0

[[model]]
provider = "codex"
model = "gpt-5.6-sol"      # 623 ms — §4's `Smart` primary
input = 0
output = 0
