# aibo — shipped default price table (§14)
#
# ============================================================================
#  THESE NUMBERS ARE A SHIPPED DEFAULT AND THEY WILL BE WRONG.
# ============================================================================
#
# §14 ships the price table as TOML *precisely because* "prices change faster
# than releases". This file is a starting point so that the spend meter, the
# 80 % warning and the optional hard stop can function on day one — it is not
# an authority, it is not a quote, and it is not checked against any provider's
# billing page at run time.
#
# What that means in practice:
#
#   * `updated` below is the date these rates were last written down. The
#     settings pane renders it next to a "prices may be stale" affordance.
#     Treat anything older than a few weeks as indicative only.
#   * A user file overlaid on this one wins, row for row. That is the intended
#     way to correct a rate — do not wait for an aibo release.
#   * A model with **no row here is unpriced, not free**. `PriceTable::lookup`
#     returns `None` and the UI must say "cost unknown". Reporting $0.00 for a
#     model whose price aibo does not know is worse than reporting nothing.
#   * Enterprise, committed-use, negotiated and regional rates are not
#     represented and cannot be. If the bill matters, override this file.
#
# ---------------------------------------------------------------------------
# Units
# ---------------------------------------------------------------------------
#
# Every rate is **micros per million tokens**, an integer:
#
#     1_000_000  micros/Mtok  =  $1.00 per million tokens
#        25_000  micros/Mtok  =  $0.025 per million tokens
#
# Integers throughout: floating-point money in a spend meter accumulates a
# drift over a month of use that the user can see.
#
# Optional rates fall back rather than to zero, so a minimal row is still
# arithmetically correct:
#
#     cached_input  omitted -> billed at `input`
#     reasoning     omitted -> billed at `output`   (what most providers do)
#     image         omitted -> billed at `input`
#
# `tier` defaults to "standard". A tier that is not listed falls back to the
# standard row for the same model, so a "flex" request is priced at the
# on-demand rate rather than becoming unpriced.
#
# ---------------------------------------------------------------------------
# Currency
# ---------------------------------------------------------------------------
#
# USD. §12 stores `cost_micros` in "the account currency"; aibo does no FX
# conversion, so a JPY-billed account sees USD figures until that is added.
# Recorded here rather than assumed.

version = "1"
updated = "2026-07-26"
source = "shipped default — published list prices, USD, no enterprise discounts; will drift"

# ===========================================================================
# Cerebras — §4 primary `Fast`, §4 `Cheap` fallback
# ===========================================================================

[[model]]
provider = "cerebras"
model = "llama-3.3-70b"
input = 850_000        # $0.85 /Mtok
output = 1_200_000     # $1.20 /Mtok
# No prompt-cache product at the time of writing: cached_input omitted, so
# cached prompt tokens are billed at the full input rate. Correct, not free.

[[model]]
provider = "cerebras"
model = "qwen-3-32b"
input = 400_000
output = 800_000

[[model]]
provider = "cerebras"
model = "gpt-oss-120b"
input = 250_000
output = 690_000

